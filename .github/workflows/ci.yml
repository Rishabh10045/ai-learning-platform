name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: All test suites
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install browser-check dependencies
        run: npm ci --no-audit --no-fund --prefix ci
      - name: Chrome version
        run: /usr/bin/google-chrome --version
      - name: Run every suite
        env:
          CHROME: /usr/bin/google-chrome
        run: bash ci/run-all.sh "$RUNNER_TEMP/study-desk-ci"
      - name: Upload logs and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: study-desk-ci
          path: ${{ runner.temp }}/study-desk-ci
          retention-days: 14
