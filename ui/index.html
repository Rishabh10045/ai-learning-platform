<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Study Desk</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 rx=%224%22 fill=%22%23c2571a%22/%3E%3C/svg%3E">
  <link rel="stylesheet" href="study-desk.css">
  <style>
    .demo-banner { margin: 0; padding: 6px 16px; font: 13px/1.4 system-ui, sans-serif; background: #fff2d9; color: #6b3d00; border-bottom: 1px solid #f0d9a8; text-align: center; }
    .demo-banner button { font: inherit; background: none; border: 0; color: #8a3b00; text-decoration: underline; cursor: pointer; padding: 0 2px; }
  </style>
</head>
<body style="margin:0">
  <p class="demo-banner" role="note"><strong>Preview with example fixture data</strong> (not the real 54-session curriculum yet). Progress is kept in this browser only; account sync comes from Codex’s progress.js. <button type="button" id="demo-reset">Reset preview</button></p>
  <div id="study-desk"></div>
  <script src="engine/schedule-engine.js"></script>
  <script src="fixtures/course.fixture.js"></script>
  <script src="fixtures/legacy-progress.fixture.js"></script>
  <script src="study-desk.js"></script>
  <script>
    // DEMO HOST ONLY. The real host (Codex's app.js + progress.js) owns persistence and account sync.
    // ?today=YYYY-MM-DD pretends today is that IST date; ?migrate=1 seeds old day-based progress and migrates it;
    // ?store=0 keeps progress in memory only.
    (function () {
      var S = window.StudyDeskSchedule, F = window.STUDY_DESK_FIXTURES, qs = new URLSearchParams(location.search);
      var KEY = "studydesk.preview.v2", useStore = qs.get("store") !== "0";
      var today = /^\d{4}-\d{2}-\d{2}$/.test(qs.get("today") || "") ? qs.get("today") : S.todayIST();
      var progress = null;
      try { progress = useStore ? JSON.parse(localStorage.getItem(KEY) || "null") : null; } catch (e) { progress = null; }
      if (qs.get("migrate") === "1") {
        var m = S.migrateProgress(F.course, F.legacyProgress);
        progress = m.progress; console.info("Migrated legacy progress", m.report);
      }
      progress = S.normalize(progress || S.emptyProgress());
      function save() { if (useStore) try { localStorage.setItem(KEY, JSON.stringify(progress)); } catch (e) {} }
      save();
      function hostChange(change) {
        change.date = change.date || today;
        var r = S.applyChange(F.course, progress, change);
        if (r.ok) { progress = r.progress; save(); desk.update({ progress: progress }); }
        return r;
      }
      var desk = StudyDesk.mount(document.getElementById("study-desk"), {
        course: F.course, progress: progress, today: today,
        sync: { state: "local", label: useStore ? "Preview · this browser only" : "Preview · memory only" },
        headerLinks: [{ label: "Coverage", href: "coverage.html" }],
        onChange: function (change) { return hostChange(change); }
      });
      window.__studyDesk = desk;
      window.__studyDeskProgress = function () { return progress; };
      window.__studyDeskApply = function (change) { return desk && arguments.length ? hostChange(change) : null; };
      document.getElementById("demo-reset").addEventListener("click", function () {
        progress = S.emptyProgress(); save(); desk.update({ progress: progress });
      });
    })();
  </script>
</body>
</html>
